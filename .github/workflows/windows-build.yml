name: Windows build

on:
  # PR branches are built by the pull_request trigger; building their pushes too doubled the minutes.
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-2025 carries Visual Studio 2026 (toolset v145) since June 2026.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # Release builds with optimisation and without _DEBUG, so it catches code
        # that only compiles in one of the two (#ifdef _DEBUG blocks, asserts).
        configuration: [ Debug, Release ]
    env:
      # Built one at a time, in dependency order, with BuildProjectReferences=false,
      # so a failure in one project does not hide the compile errors of the
      # projects that depend on it. (Their link step will still fail.)
      PROJECTS: >-
        zlib/ZLib.vcxproj
        guids/Guids.vcxproj
        _Utility/Utility.vcxproj
        engine/Engine.vcxproj
        effect/Effect.vcxproj
        soundengine/SoundEngine.vcxproj
        Igc/Igc.vcxproj
        clintlib/ClintLib.vcxproj
        training/Training.vcxproj
        test/TCLib/TCLib.vcxproj
        FedSrv/AllSrv32.vcxproj
        WinTrek/Allegiance.vcxproj
        mdlc/mdlc.vcxproj
        cvh/cvh.vcxproj
        xmunge/xmunge.vcxproj
        qhull/qhull.vcxproj
        tests/UnitTests/UnitTests.vcxproj

    steps:
      - name: Checkout (code only, Artwork excluded)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Artwork/

      - name: Locate MSBuild and report toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -format text | Select-String -Pattern '^(displayName|installationVersion|installationPath):'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $msbuild -version -nologo
          $vsPath = & $vswhere -latest -products * -property installationPath
          $toolsets = Get-ChildItem "$vsPath\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name -Unique
          "x64 platform toolsets: $($toolsets -join ', ')"
          if ($toolsets -notcontains 'v145') { Write-Warning "Toolset v145 (VS 2026) not found on this image" }
          $atl = Test-Path "$vsPath\VC\Tools\MSVC\*\atlmfc\include\atlbase.h"
          "ATL/MFC installed: $atl"

      - name: Restore NuGet packages (MsQuic)
        shell: pwsh
        run: |
          # packages.config restore into packages\, the folder Visual Studio uses for the solution
          if (Get-Command nuget -ErrorAction SilentlyContinue) {
            nuget restore _Utility\packages.config -PackagesDirectory packages -NonInteractive
          } else {
            & $env:MSBUILD _Utility/Utility.vcxproj -nologo -t:restore -p:RestorePackagesConfig=true "-p:SolutionDir=$pwd\" -p:Platform=x64
          }
          if (-not (Test-Path packages/Microsoft.Native.Quic.MsQuic.Schannel.*/build/native/include/msquic.h)) { throw "MsQuic was not restored" }

      - name: Build (${{ matrix.configuration }}|x64)
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out/logs | Out-Null
          $failed = @()
          foreach ($p in $env:PROJECTS -split '\s+' | Where-Object { $_ }) {
            $name = [IO.Path]::GetFileNameWithoutExtension($p)
            Write-Host "::group::$name"
            & $env:MSBUILD $p -nologo -m -p:Configuration=${{ matrix.configuration }} -p:Platform=x64 `
              -p:BuildProjectReferences=false `
              -fl "-flp:logfile=out/logs/$name.log;verbosity=normal" `
              -fl1 "-flp1:logfile=out/logs/$name.errors.log;errorsonly" `
              -clp:ErrorsOnly
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Write-Host "::endgroup::"
          }
          if ($failed.Count) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }

      - name: Unit tests
        id: tests
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/ci/unit-tests.ps1 -Dll out/bin/x64/${{ matrix.configuration }}/UnitTests.dll -Out out/logs -Label ${{ matrix.configuration }}

      # Art toolchain smoke test (Phase 4): mdlc starts the engine with its software
      # DirectDraw path. This tells us whether art can be converted on a headless
      # runner at all. Only the three input files are fetched, not all of Artwork/.
      - name: Fetch smoke-test art
        if: always()
        shell: cmd
        run: |
          mkdir out\smoke-src
          git cat-file blob HEAD:Artwork/256/acbuild.dds > out\smoke-src\acbuild.dds
          git cat-file blob HEAD:Artwork/256/acs01.dds > out\smoke-src\acs01.dds
          git cat-file blob HEAD:Artwork/256/animlaunch.dds > out\smoke-src\animlaunch.dds
          git cat-file blob HEAD:Artwork/256/fontsource.mdl > out\smoke-src\fontsource.mdl

      - name: mdlc smoke test
        id: smoke
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/ci/mdlc-smoke.ps1 -Mdlc out/bin/x64/${{ matrix.configuration }}/mdlc.exe -Art out/smoke-src -Out out/art-smoke

      - name: Error summary
        if: always()
        shell: pwsh
        run: |
          $rx = '(?<file>[^\s:][^:]*?)\((?<line>\d+)[^)]*\)\s*:\s*(fatal )?error (?<code>[A-Z]+\d+)\s*:\s*(?<msg>.*?)(\s+\[[^\]]+\])?$'
          $out = @("## Build errors (${{ matrix.configuration }}|x64)", "", "| Project | Errors | Top codes |", "|---|---:|---|")
          $detail = @()
          foreach ($log in Get-ChildItem out/logs/*.errors.log -ErrorAction SilentlyContinue) {
            $name = $log.BaseName -replace '\.errors$',''
            $errs = Get-Content $log | ForEach-Object { if ($_ -match $rx) { [pscustomobject]@{ File = (Split-Path $Matches.file -Leaf); Line = $Matches.line; Code = $Matches.code; Msg = $Matches.msg } } } |
                    Sort-Object File, Line, Code, Msg -Unique
            $codes = ($errs | Group-Object Code | Sort-Object Count -Descending | Select-Object -First 5 | ForEach-Object { "$($_.Name)x$($_.Count)" }) -join ', '
            $out += "| $name | $(@($errs).Count) | $codes |"
            if (@($errs).Count) {
              $detail += "", "### $name (first 25 distinct)", '```'
              $detail += $errs | Select-Object -First 25 | ForEach-Object { "$($_.File)($($_.Line)): $($_.Code): $($_.Msg)" }
              $detail += '```'
            }
          }
          ($out + $detail) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ matrix.configuration }}
          path: |
            out/logs/
            out/art-smoke/
          if-no-files-found: warn

      - name: Upload art tools
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: art-tools-${{ matrix.configuration }}
          path: |
            out/bin/x64/${{ matrix.configuration }}/mdlc.*
            out/bin/x64/${{ matrix.configuration }}/xmunge.*
            out/bin/x64/${{ matrix.configuration }}/cvh.*
            out/bin/x64/${{ matrix.configuration }}/qhull.*
          retention-days: 3
          if-no-files-found: error

      - name: Fail if any project failed
        if: steps.build.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

  # AddressSanitizer: the libraries the unit tests and mdlc need, built with
  # /fsanitize=address, then the unit tests and the mdlc smoke test (which
  # loads MDL, the code path of the ObjectStack use-after-free). Release, since
  # ASan does not combine with the Debug configuration's /RTC checks.
  asan:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CONFIGURATION: Release
      PROJECTS: >-
        zlib/ZLib.vcxproj
        engine/Engine.vcxproj
        effect/Effect.vcxproj
        mdlc/mdlc.vcxproj
        tests/UnitTests/UnitTests.vcxproj
    steps:
      - name: Checkout (code only, Artwork excluded)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Artwork/

      - name: Locate MSBuild and the ASan runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vsPath = & $vswhere -latest -products * -property installationPath
          $dll = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dll) { throw "The AddressSanitizer runtime is not installed on this image" }
          "ASan runtime: $($dll.FullName)"
          # The instrumented exes and the test DLL load the runtime from PATH
          $dll.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build with AddressSanitizer
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out/logs | Out-Null
          $failed = @()
          foreach ($p in $env:PROJECTS -split '\s+' | Where-Object { $_ }) {
            $name = [IO.Path]::GetFileNameWithoutExtension($p)
            Write-Host "::group::$name"
            & $env:MSBUILD $p -nologo -m -p:Configuration=$env:CONFIGURATION -p:Platform=x64 `
              -p:BuildProjectReferences=false -p:EnableASAN=true `
              -fl "-flp:logfile=out/logs/$name.log;verbosity=normal" `
              -fl1 "-flp1:logfile=out/logs/$name.errors.log;errorsonly" `
              -clp:ErrorsOnly
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Write-Host "::endgroup::"
          }
          if ($failed.Count) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }

      - name: Unit tests under ASan
        id: tests
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/ci/unit-tests.ps1 -Dll out/bin/x64/$env:CONFIGURATION/UnitTests.dll -Out out/logs -Label asan

      - name: Fetch smoke-test art
        if: always()
        shell: cmd
        run: |
          mkdir out\smoke-src
          git cat-file blob HEAD:Artwork/256/acbuild.dds > out\smoke-src\acbuild.dds
          git cat-file blob HEAD:Artwork/256/acs01.dds > out\smoke-src\acs01.dds
          git cat-file blob HEAD:Artwork/256/animlaunch.dds > out\smoke-src\animlaunch.dds
          git cat-file blob HEAD:Artwork/256/fontsource.mdl > out\smoke-src\fontsource.mdl

      # An ASan report goes to stderr, which the script keeps in <step>.log.err
      - name: mdlc smoke test under ASan
        id: smoke
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/ci/mdlc-smoke.ps1 -Mdlc out/bin/x64/$env:CONFIGURATION/mdlc.exe -Art out/smoke-src -Out out/art-smoke

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: asan-logs
          path: |
            out/logs/
            out/art-smoke/*.log*
          if-no-files-found: warn

      - name: Fail if anything failed
        if: steps.build.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

  # Phase 4: convert the art with the tools the build job produced. Runs on its
  # own runner so the build job's checkout can keep skipping Artwork/. The art
  # is converted once, with the Debug tools; the Release tools only get the
  # mdlc smoke test above.
  art:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug ]
    steps:
      - name: Checkout (Art.proj, Artwork/256, Artwork/tools, tools/ci)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Artwork/Art.proj
            /Artwork/256/
            /Artwork/tools/
            /tools/ci/

      - name: Fetch art tools
        uses: actions/download-artifact@v5
        with:
          name: art-tools-${{ matrix.configuration }}
          path: out/bin/x64/${{ matrix.configuration }}

      - name: Build art
        id: art
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force out/logs | Out-Null
          & $msbuild Artwork/Art.proj -nologo -p:Configuration=${{ matrix.configuration }} `
            -fl "-flp:logfile=out/logs/art.log;verbosity=normal" -clp:Summary
          $code = $LASTEXITCODE
          $files = Get-ChildItem out/Artwork -File -ErrorAction SilentlyContinue
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          $byExt = $files | Group-Object Extension | Sort-Object Count -Descending | ForEach-Object { "$($_.Name) $($_.Count)" }
          "## Art (${{ matrix.configuration }})", "", "$(@($files).Count) files, $mb MB: $($byExt -join ', ')" -join "`n" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      - name: Crash stack of a failed mdlc batch
        if: failure() && steps.art.outcome == 'failure'
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./tools/ci/mdlc-crash-stack.ps1 -Mdlc out/bin/x64/${{ matrix.configuration }}/mdlc.exe `
            -Log out/logs/art.log -ArtSource Artwork/256 -ArtOut out/Artwork -Out out/logs

      - name: Upload art
        uses: actions/upload-artifact@v5
        with:
          name: art-${{ matrix.configuration }}
          path: out/Artwork/
          retention-days: 7
          if-no-files-found: error

      - name: Upload art logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: art-logs-${{ matrix.configuration }}
          path: |
            out/logs/
            out/obj/Artwork/
          if-no-files-found: warn
